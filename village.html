<style>

    height: 22px; padding: 4px 8px; font-size: 9px; line-height: 12px; letter-spacing: .1em; white-space: nowrap; overflow: hidden; display: block; text-overflow: ellipsis; }

<script type="module">
// village.html — the third view of each ecosystem (graph → globe → village): one village per ecosystem, a district per
// continent of its globe. Places are buildings sized by their real connection count; villagers are the data stream.
// Data: lab/agent-feed.mjs GET /api/eco/<hark|personal|misfit> on loopback (built by lab/ecosystem/eco-feed.mjs): real,

// Creator checks.
// Page contract: renderAt(t) deterministic in demo, seam t=0 == t=P, ?w=&h= sizes, Look / Layout knobs.
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const PUBLIC = q.get('public') === '1';
// the public door publishes no misfit village (its count rides on the others): ?eco=misfit there opens HARK
const ECO = ['hark', 'personal', 'misfit'].includes(q.get('eco')) && !(PUBLIC && q.get('eco') === 'misfit') ? q.get('eco') : 'hark';
const tparam = q.get('t'), fixedTime = tparam != null;

// (the canvas would then keep it grown), and shrinks it to the zoomed view when the page is pinch-zoomed.

let PHONE = PHONE_Q.matches;
const viewW = () => document.documentElement.clientWidth || innerWidth, viewH = () => document.documentElement.clientHeight || innerHeight;   // not innerWidth: a pinch-zoomed page reports the zoomed width there

const P = 40; window.__period = P; window.__jitter = () => {};
// culture follows the spec's tier table: Greco-Roman for Personal and for HARK's code quarters, Mesopotamian only for the

const cultureOf = district => ECO === 'misfit' ? 'misfit' : ECO === 'hark' && FACILITY_IDS.has(district) ? 'meso' : 'greco';
let FACILITY_IDS = new Set();
const PRIVATE = !PUBLIC && !fixedTime;                  // the private door's actions: Refresh, sort
const K = { look: 'day', layout: 'full hud' };
const tau = Math.PI * 2;
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

// ---------- noise (from agent-village) ----------
function makeNoise(seed) {
  const r = rng(seed), perm = new Uint16Array(512), val = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; val[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 256; i++) perm[256 + i] = perm[i];
  const at = (x, y) => val[perm[(perm[x & 255] + y) & 255]];
  const n = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), u), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), u), v); };

  return { n, fbm };
}
const nz = makeNoise(ECO === 'hark' ? 11 : ECO === 'personal' ? 23 : 37);

// ---------- renderer, camera, lights ----------
const INK = new THREE.Color('#0a0a0a');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
// a phone's 3x screen draws at 2x (9 px of fill per css px would be 4 there)
renderer.setPixelRatio(fixedTime ? 1 : Math.min(devicePixelRatio, PHONE ? 2 : 1.5)); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);
renderer.domElement.style.width = W + 'px'; renderer.domElement.style.height = H + 'px';
const scene = new THREE.Scene(); scene.background = INK; scene.fog = new THREE.Fog(INK, 300, 700);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
